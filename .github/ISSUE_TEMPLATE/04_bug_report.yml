name: "🐛 Błąd w konfiguracji / środowisku lab"
description: "Zgłoś problem z działaniem skryptu, szablonu VM lub laboratorium"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Którego projektu dotyczy problem?
      options:
        - "architektura-proxmox"
        - "architektura-vdi-opennebula"
        - "materialy-dydaktyczne"
        - "pakiet-red-teaming"
        - "strona-kola"
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: Komunikat błędu / Logi z terminala
      description: Wklej dokładny output błędu (np. z Ansible, Terraform, dmesg, journalctl)
      render: shell
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Kroki do odtworzenia błędu
      value: |
        1. Wykonałem polecenie: `...`
        2. System / maszyna zgłosiła: `...`
        3. Oczekiwany rezultat vs faktyczny rezultat: 
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Środowisko uruchomieniowe
      placeholder: np. Proxmox VE 8.2, maszyna Debian 12, kernel 6.8...
