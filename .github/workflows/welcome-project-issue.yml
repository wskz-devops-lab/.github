name: "Obsługa zgłoszenia projektu studenckiego"

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write

jobs:
  process-issue:
    if: contains(github.event.issue.labels.*.name, 'projekt-studenta') || startsWith(github.event.issue.title, '[PROJEKT]')
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Przetwórz zgłoszenie i utwórz repozytorium
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 .github/scripts/process_project_issue.py
