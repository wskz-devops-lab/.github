name: "🛡️ Nowy test audytu bezpieczeństwa / Red Teaming"
description: "Dodanie nowego testu weryfikującego bezpieczeństwo środowiska wirtualizacji"
title: "[SEC-TEST]: "
labels: ["security", "red-teaming"]
body:
  - type: dropdown
    id: pillar
    attributes:
      label: Filar ochrony
      description: Do którego z 5 filarów zalicza się ten test?
      options:
        - "1. Izolacja hipernadzorcy i ucieczka z wirtualizacji (VM/LXC escape)"
        - "2. Segmentacja sieciowa i podsłuch ruchu (SDN/VLAN spoofing)"
        - "3. Uprawnienia, eskalacja i zarządzanie tożsamością"
        - "4. Ochrona danych, integralność i bezpieczeństwo nośników (Storage/ZFS)"
        - "5. Dostępność, limitowanie zasobów i ochrona przed DoS"
    validations:
      required: true
  - type: textarea
    id: attack-scenario
    attributes:
      label: Scenariusz wektora ataku / audytu
      description: Jaki wektor badamy i jakie jest potencjalne ryzyko?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Proponowany sposób automatycznej weryfikacji
      description: W jaki sposób skrypt ma sprawdzić podatność (polecenie bash, zapytanie do API Proxmox, test uprawnień)?
    validations:
      required: true
